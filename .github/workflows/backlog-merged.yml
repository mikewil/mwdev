name: Mark completed backlog items

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  complete-project-item:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: read
          permission-repository-projects: write
      - name: Mark linked issue complete
        run: node scripts/mark-backlog-done.mjs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_PROJECT_ID: ${{ vars.CODEX_PROJECT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
